name: CI

on: 
  push: 
    branches: [ main ]
  pull_request: [ main ]
    branches: [ main ]

jobs: 
  build: 
    name: Build
    runs-on: macos-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: xcodebuild clean build -project Movieez.xcodeproj -scheme Movieez -destination 'platform=iOS Simulator, name=iPhone 17 Pro'
