name: iOS CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild clean build \
            -project Movieez.xcodeproj \
            -scheme Movieez \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro'

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Movieez.xcodeproj \
            -scheme Movieez \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
